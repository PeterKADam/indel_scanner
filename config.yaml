# indel_scanner/config.yaml

# ==================================
# SCANNER CONFIGURATION (for 'scan' command)
# ==================================
scan:
  # --- Analysis Parameters ---
  min_indel_size: 1
  min_mapping_quality: 20

  # --- Performance Parameters ---
  # Number of parallel processes to use. 'null' means use all available CPU cores.
  num_processes: 30
  preload_contigs: true 
  write_buffer_size: 100

# ==================================
# PROCESSOR CONFIGURATION (for 'process' command - currently empty)
# ==================================
process:
  # Example placeholders for future processing logic:
  # min_read_count: 5
  # min_vaf_threshold: 0.05
  # pass_filter: true
  output_format: tsv
